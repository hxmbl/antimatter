name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and run tests
    runs-on: macos-15

    concurrency:
      group: antimatter-${{ github.ref }}
      cancel-in-progress: true

    # Report-only by design: commits never have to compile, they only have to
    # be fixable. CI surfaces breakage so the "refine" passes can find it,
    # without ever blocking the fast push.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # Ad-hoc signing (CODE_SIGN_IDENTITY=-) is enough for a macOS hosted
      # test run; it embeds entitlements without needing a developer account.
      # CloudKit degrades gracefully when iCloud is unsigned-in, so the suite
      # stays green on runners without an iCloud account.
      - name: Build and test
        run: |
          xcodebuild test \
            -project antimatter.xcodeproj \
            -scheme antimatter \
            -destination 'platform=macOS' \
            -derivedDataPath .ci-build \
            CODE_SIGN_IDENTITY="-"