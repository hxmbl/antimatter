name: Test, Build & Publish macOS Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-intel:
    name: Build and run tests intel
    runs-on: macos-26-intel
    concurrency:
      group: antimatter-intel-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      # Ad-hoc signing (CODE_SIGN_IDENTITY=-) is enough for a macOS hosted
      # test run; it embeds entitlements without needing a developer account.
      # CloudKit degrades gracefully when iCloud is unsigned-in, so the suite
      # stays green on runners without an iCloud account.
      - name: Build and test
        run: |
          xcodebuild test \
            -project antimatter.xcodeproj \
            -scheme antimatter \
            -destination 'platform=macOS' \
            -derivedDataPath .ci-build \
            CODE_SIGN_IDENTITY="-"

  publish-macos-release:
    name: Build and release app
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-intel, test-arm]
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: |
          xcodebuild build \
            -project antimatter.xcodeproj \
            -scheme antimatter \
            -configuration Release \
            -derivedDataPath .release-build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            .release-build/Build/Products/Release/antimatter.app \
            "dist/Antimatter-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Antimatter-${GITHUB_REF_NAME}.zip" \
            --generate-notes
  test-arm:
    name: Build and run tests ARM
    runs-on: macos-26
    concurrency:
      group: antimatter-arm-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      # Ad-hoc signing (CODE_SIGN_IDENTITY=-) is enough for a macOS hosted
      # test run; it embeds entitlements without needing a developer account.
      # CloudKit degrades gracefully when iCloud is unsigned-in, so the suite
      # stays green on runners without an iCloud account.
      - name: Build and test
        run: |
          xcodebuild test \
            -project antimatter.xcodeproj \
            -scheme antimatter \
            -destination 'platform=macOS' \
            -derivedDataPath .ci-build \
            CODE_SIGN_IDENTITY="-"
