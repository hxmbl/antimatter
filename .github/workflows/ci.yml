name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/_tests.yml

  ci:
    name: CI
    if: ${{ always() }}
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify test workflow result
        run: |
          echo "Tests workflow result: ${{ needs.tests.result }}"
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "::error::CI requires both Intel and Apple Silicon test jobs to succeed."
            exit 1
          fi
          echo "All required test jobs succeeded."
